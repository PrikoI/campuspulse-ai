name: Deploy CampusPulse to Cloud Run

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: campuspulse-cloud-run-main
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check deployment settings
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          GCP_RUNTIME_SERVICE_ACCOUNT: ${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          LMS_SESSION_SECRET_NAME: ${{ vars.LMS_SESSION_SECRET_NAME }}
        run: |
          set -euo pipefail
          for name in GCP_PROJECT_ID GCP_WORKLOAD_IDENTITY_PROVIDER GCP_DEPLOY_SERVICE_ACCOUNT GCP_RUNTIME_SERVICE_ACCOUNT FIREBASE_PROJECT_ID LMS_SESSION_SECRET_NAME; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Set the GitHub Actions variable $name before deploying."
              exit 1
            fi
          done

      - name: Check out source
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy private Cloud Run service
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION || 'us-central1' }}
          GCP_RUNTIME_SERVICE_ACCOUNT: ${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          LMS_SESSION_SECRET_NAME: ${{ vars.LMS_SESSION_SECRET_NAME }}
          AGENT_ENGINE_RESOURCE: ${{ vars.CAMPUSPULSE_AGENT_ENGINE_RESOURCE }}
        run: |
          set -euo pipefail
          gcloud run deploy campuspulse-ui \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --source . \
            --service-account "$GCP_RUNTIME_SERVICE_ACCOUNT" \
            --no-allow-unauthenticated \
            --min 0 \
            --max 1 \
            --concurrency 2 \
            --timeout 300 \
            --set-env-vars "CAMPUSPULSE_LMS_REPOSITORY=firestore,CAMPUSPULSE_FIREBASE_PROJECT=$FIREBASE_PROJECT_ID,CAMPUSPULSE_FIREBASE_CREDENTIALS=adc,CAMPUSPULSE_AGENT_ENGINE_RESOURCE=$AGENT_ENGINE_RESOURCE,CAMPUSPULSE_DEMO_STUDENTS=student1" \
            --set-secrets "CAMPUSPULSE_LMS_SESSION_SECRET=$LMS_SESSION_SECRET_NAME:latest"
          service_url="$(gcloud run services describe campuspulse-ui \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --format='value(status.url)')"
          if [[ -z "$service_url" ]]; then
            echo "::error::Cloud Run deployed but returned no service URL."
            exit 1
          fi
          gcloud run services update campuspulse-ui \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --update-env-vars "CAMPUSPULSE_PUBLIC_ORIGIN=$service_url"
          echo "Cloud Run service deployed: $service_url (private; requires IAM authentication)"
